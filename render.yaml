services:
  - type: web
    name: alpha-hunter-pro
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alpha-hunter-db
          property: connectionString

databases:
  - name: alpha-hunter-db
    plan: free
    databaseName: alpha_hunter
    user: alpha_hunter
